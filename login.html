<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VPSel.ru</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#06070D;
      --card:#0C1018;
      --border:#141D2D;
      --blue:#4B82FF;
      --white:#FFFFFF;
      --gray:#7F8696;
    }

    body{
      width:100%;
      min-height:100vh;

      overflow:hidden;

      background:var(--bg);

      font-family:'Manrope',sans-serif;
      color:var(--white);

      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;

      position:relative;
    }

    /* GRID */

    body::before{
      content:"";
      position:fixed;
      inset:0;

      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);

      background-size:52px 52px;

      pointer-events:none;
      z-index:0;
    }

    /* SIDE GLOW */

    body::after{
      content:"";
      position:fixed;
      inset:0;

      background:
        radial-gradient(
          circle at bottom left,
          rgba(72,128,255,0.16),
          transparent 28%
        ),

        radial-gradient(
          circle at top right,
          rgba(72,128,255,0.16),
          transparent 28%
        );

      pointer-events:none;
      z-index:0;
    }
    .logo{
      position:absolute;
      top:92px;

      display:flex;
      align-items:center;
      gap:16px;

      font-size:30px;
      font-weight:700;

      z-index:5;
    }

    .logo-icon{
      width:42px;
      height:42px;

      border-radius:14px;

      overflow:hidden;

      flex-shrink:0;
    }

    .logo-icon img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .login-card{
      width:100%;
      max-width:345px;

      background:rgba(11,15,24,0.92);

      border:1px solid rgba(72,128,255,0.08);

      border-radius:24px;

      padding:30px 24px 28px;

      position:relative;
      z-index:5;

      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .title{
      font-size:21px;
      line-height:1.25;
      font-weight:700;

      margin-bottom:10px;
    }

    .subtitle{
      font-size:14px;
      line-height:1.55;
      font-weight:600;

      color:var(--gray);

      margin-bottom:24px;
    }

    .form-group{
      margin-bottom:12px;
    }

    .input{
      width:100%;
      height:50px;

      border:none;
      outline:none;

      border-radius:14px;

      background:#0B1320;

      border:1px solid #13203A;

      padding:0 16px;

      color:white;

      font-family:'Manrope',sans-serif;
      font-size:14px;
      font-weight:600;

      transition:.2s ease;
    }

    .input::placeholder{
      color:#6E7687;
    }

    .input:focus{
      border-color:rgba(72,128,255,0.4);
    }

    .btn{
      width:100%;
      height:50px;

      margin-top:14px;

      border:none;
      outline:none;

      border-radius:14px;

      background:var(--blue);

      color:white;

      font-family:'Manrope',sans-serif;
      font-size:16px;
      font-weight:700;

      cursor:pointer;

      transition:.2s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .bottom-text{
      margin-top:22px;

      text-align:center;

      color:#7F8696;

      font-size:13px;
      line-height:1.5;
      font-weight:600;
    }

    .bottom-text a{
      color:#9AB8FF;
      text-decoration:none;
    }

    @media (max-width:640px){

      body{
        padding:20px;
      }

      .logo{
        top:42px;
        font-size:24px;
      }

      .login-card{
        max-width:100%;
      }
    }

  </style>
</head>
<body>

  <!-- LOGO -->

  <div class="logo">

    <div class="logo-icon">
      <img src="https://raw.githubusercontent.com/TrashBagStudio/ProjectVPN/refs/heads/main/Untitled%20(100).png" alt="logo">
    </div>

    VPSel.ru

  </div>

  <!-- LOGIN -->

  <div class="login-card">

    <div class="title">
      Вход в личный кабинет
    </div>

    <div class="subtitle">
      Для регистрации обратитесь к менеджеру.
    </div>

    <form>

      <div class="form-group">
        <input
          type="text"
          class="input"
          placeholder="Логин"
        >
      </div>

      <div class="form-group">
        <input
          type="password"
          class="input"
          placeholder="Пароль"
        >
      </div>

      <button class="btn">
        Начать сейчас
      </button>

    </form>

    <div class="bottom-text">
      Продолжая, вы соглашаетесь с<br>
      <a href="#">пользовательским соглашением</a>
    </div>

  </div>

</body>
</html>
